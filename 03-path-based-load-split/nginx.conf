# =============================================================================
# 03 - Path-based load splitting (layer 7)
# -----------------------------------------------------------------------------
# File:     03-path-based-load-split/nginx.conf
# Install:  /etc/nginx/nginx.conf
#
# Routes requests on :8080 to different upstream pools by URL path:
#     /         -> backends (1111, 2222, 3333)
#     /node1    -> load1    (1111, 2222)
#     /node2    -> load2    (3333)
#
# Test:     curl http://localhost:8080/node1   (alternates 1111 / 2222)
#           curl http://localhost:8080/node2   (always 3333)
# =============================================================================

http {
	upstream backends {
		server 127.0.0.1:1111;
		server 127.0.0.1:2222;
		server 127.0.0.1:3333;
	}

	upstream load1 {
		server 127.0.0.1:1111;
		server 127.0.0.1:2222;
	}

	upstream load2 {
		server 127.0.0.1:3333;
	}

	server {
		listen 8080;

		location / {
			proxy_pass http://backends/;
		}

		location /node1 {
			proxy_pass http://load1/;
		}

		location /node2 {
			proxy_pass http://load2/;
		}
	}
}

events {}
