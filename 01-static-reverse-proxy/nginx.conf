# =============================================================================
# 01 - Static file server + reverse proxy
# -----------------------------------------------------------------------------
# File:     01-static-reverse-proxy/nginx.conf
# Install:  /etc/nginx/nginx.conf
#
# - :8080 serves static files from /home/ubuntu/content
#     /images/...   -> /home/ubuntu/images/...
#     *.png         -> 404 (blocked)
# - :80 reverse-proxies to the :8080 server
#     /             -> http://127.0.0.1:8080/
#     /img/...      -> http://127.0.0.1:8080/images/...
#
# Test:     sudo nginx -t && sudo nginx -s reload
# =============================================================================

http {
	include mime.types;

	server {
		listen 8080;
		root /home/ubuntu/content;

		location /images {
			root /home/ubuntu/;       # /images/a.jpg -> /home/ubuntu/images/a.jpg
		}

		location ~ \.png$ {
			return 404;               # escape the dot: "." alone matches any char
		}
	}

	server {
		listen 80;

		location / {
			proxy_pass http://127.0.0.1:8080/;
		}

		location /img {
			proxy_pass http://127.0.0.1:8080/images/;
		}
	}
}

events {}
