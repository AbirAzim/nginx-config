# =============================================================================
# 02 - Layer 7 (HTTP) load balancer
# -----------------------------------------------------------------------------
# File:     02-load-balancer-l7/nginx.conf
# Install:  /etc/nginx/nginx.conf
#
# Round-robins HTTP requests on :8080 across three Docker containers
# (nodeapp1/2/3 published on 1111/2222/3333). Forwards the real client IP.
#
# Test:     for i in 1 2 3 4 5 6; do curl -s http://localhost:8080; echo; done
# =============================================================================

http {
	upstream backends {
		# ip_hash;                    # sticky by client IP (uncomment to test)
		server 127.0.0.1:1111;
		server 127.0.0.1:2222;
		server 127.0.0.1:3333;
	}

	server {
		listen 8080;

		location / {
			proxy_pass http://backends/;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}
	}
}

events {}
