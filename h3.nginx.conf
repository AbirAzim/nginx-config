# EC2 + Nginx + Docker + HTTPS/HTTP3 — Practice Notes

Hands-on notes from setting up Nginx on an Ubuntu EC2 instance: static hosting, reverse proxy, load balancing Docker containers, layer 4 vs layer 7 proxying, Let's Encrypt TLS, HTTP/2 and HTTP/3.

> Addresses are replaced with placeholders. `<public-ip>` = the instance's public IPv4.

---

## 0. Server

| Item | Value |
|---|---|
| Instance | EC2 `t3.micro`, Ubuntu (user `ubuntu`) |
| Key pair | `nginx-ec2.pem` (never commit it) |
| Domain | `nginx-badhon.webhop.me` (No-IP free DNS) |
| Nginx config | `/etc/nginx/nginx.conf` |
| Static content | `/home/ubuntu/content` |
| Images | `/home/ubuntu/images` |
| Node app | `/home/ubuntu/nodecicd` |

Connect (run on the Mac):

```bash
chmod 400 nginx-ec2.pem
ssh -i "nginx-ec2.pem" ubuntu@<public-ip>
```

- Amazon Linux uses `ec2-user` + `dnf`; Ubuntu uses `ubuntu` + `apt`.
- The prompt shows the **private** IP (`ip-172-31-x-x`). Always connect from outside using the **public** IP or domain.
- The public IP changes on stop/start unless an **Elastic IP** is attached.

