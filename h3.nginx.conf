## 5. Load balancing (layer 7, `http`)

```nginx
http {
	upstream backends {
		# ip_hash;                   # sticky by client IP (uncomment to test)
		server 127.0.0.1:1111;
		server 127.0.0.1:2222;
		server 127.0.0.1:3333;
	}

	server {
		listen 8080;

		location / {
			proxy_pass http://backends/;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}
	}
}

events {}
```

Watch round robin:

```bash
for i in 1 2 3 4 5 6; do curl -s http://localhost:8080 | grep -o '"appId":"[0-9]*"'; done
```

Algorithms:

| Directive | Behaviour |
|---|---|
| (default) | Round robin |
| `ip_hash;` | Same client → same backend. Modulo hash on the first 3 IPv4 octets — **not** consistent hashing; adding/removing a server reshuffles most clients |
| `hash $remote_addr consistent;` | Real consistent hashing (ketama ring); only ~1/N of clients move when the pool changes |

