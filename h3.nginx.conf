## 2. Static website from the home folder

```bash
mkdir -p ~/content
nano ~/content/index.html
```

```nginx
http {
	include mime.types;

	server {
		listen 8080;
		root /home/ubuntu/content;
	}
}

events {}
```

### Fixing `403 Forbidden`

Nginx workers run as `www-data`, which counts as **others** for files in `/home/ubuntu`. To read a file, a user needs `x` on **every directory** in the path and `r` on the file.

```bash
chmod o+x /home/ubuntu
chmod o+x /home/ubuntu/content
chmod o+r /home/ubuntu/content/index.html
# or everything inside a folder (capital X = dirs only):
chmod -R o+rX /home/ubuntu/content
```

| Permission | On a file | On a directory |
|---|---|---|
| `r` | read contents | list contents |
| `w` | modify | create/delete inside |
| `x` | execute | enter / pass through |

Tighter alternative — give access to the group instead of everyone:

```bash
sudo usermod -aG ubuntu www-data
chmod g+x /home/ubuntu
sudo systemctl restart nginx          # restart, not reload, to pick up new groups
```

On real servers, keep site files in `/var/www/` instead.

### Locations, regex, and a reverse proxy

```nginx
http {
	server {
		listen 8080;
		root /home/ubuntu/content;

		location /images {
			root /home/ubuntu/;       # /images/a.jpg → /home/ubuntu/images/a.jpg
		}

		location ~ \.png$ {
			return 404;               # block all .png (escape the dot in regex)
		}
	}

	server {
		listen 80;

		location / {
			proxy_pass http://127.0.0.1:8080/;
		}

		location /img {
			proxy_pass http://127.0.0.1:8080/images/;
		}
	}
}

events {}
```

Use `127.0.0.1` (not the public IP) to reach services on the same machine.

