## 7. Domain + HTTPS (Let's Encrypt)

### DNS

Free hostname from No-IP: <https://my.noip.com/dns/records?jump_to_zone=webhop.me>
Point the A record at the EC2 public IP (attach an Elastic IP so it doesn't change).

```bash
ping nginx-badhon.webhop.me          # should resolve to the EC2 IP
```

### Get the certificate

Port 80 must be open and free (`--standalone` runs its own web server for the http-01 challenge).

```bash
sudo apt update
sudo apt install -y certbot
sudo systemctl stop nginx
sudo certbot certonly --standalone -d nginx-badhon.webhop.me
sudo systemctl start nginx
```

Files:

```
/etc/letsencrypt/live/nginx-badhon.webhop.me/fullchain.pem
/etc/letsencrypt/live/nginx-badhon.webhop.me/privkey.pem
```

Renewal (certs last 90 days; standalone needs port 80 free):

```bash
sudo certbot renew --dry-run --pre-hook "systemctl stop nginx" --post-hook "systemctl start nginx"
```

TLS check: <https://www.cdn77.com/tls-test/result?domain=nginx-badhon.webhop.me>

