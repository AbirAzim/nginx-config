## 6. Layer 4 proxy (`stream`)

```nginx
include /etc/nginx/modules-enabled/*.conf;    # loads the stream module on Ubuntu

stream {
	upstream backends {
		server 127.0.0.1:1111;
		server 127.0.0.1:2222;
		server 127.0.0.1:3333;
	}

	server {
		listen 8080;
		proxy_pass backends;
	}
}

events {}
```

If `unknown directive "stream"`: `sudo apt install -y libnginx-mod-stream` and keep the `include` line at the top.

| | `http` (layer 7) | `stream` (layer 4) |
|---|---|---|
| Sees | URL, headers, method | Raw TCP bytes |
| `location` routing | Yes | No |
| Add headers (`X-Forwarded-For`) | Yes | No |
| Balances per | Request | TCP connection (browser keep-alive sticks to one backend) |

