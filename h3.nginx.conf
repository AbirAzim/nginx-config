## 8. HTTP/2 + HTTP/3 (final config)

```nginx
http {
	upstream backends {
		server 127.0.0.1:1111;
		server 127.0.0.1:2222;
		server 127.0.0.1:3333;
	}

	server {
		listen 80;
		listen 8080;
		listen 443 ssl;                # HTTPS over TCP (HTTP/1.1 + HTTP/2)
		listen 443 quic reuseport;     # HTTP/3 over UDP
		http2 on;

		server_name nginx-badhon.webhop.me;

		ssl_certificate /etc/letsencrypt/live/nginx-badhon.webhop.me/fullchain.pem;
		ssl_certificate_key /etc/letsencrypt/live/nginx-badhon.webhop.me/privkey.pem;

		add_header Alt-Svc 'h3=":443"; ma=86400';   # tells browsers HTTP/3 exists

		location / {
			proxy_pass http://backends/;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}
	}
}

events {}
```

- Old tutorials use `listen 443 ssl http3;` — that fails on current Nginx (`invalid parameter "http3"`). Use `quic` instead.
- Check support: `nginx -V 2>&1 | grep -o http_v3_module`

### Verify

```bash
curl -sI https://nginx-badhon.webhop.me | grep -i alt-svc   # server advertises h3
sudo ss -ulnp | grep 443                                    # nginx listening on UDP
sudo tcpdump -ni any udp port 443                           # do QUIC packets arrive?
```

In Chrome: DevTools → Network → right-click headers → enable **Protocol**. First load is `h2`, later loads switch to `h3`. If stuck on `h2`, quit Chrome fully (Cmd+Q) and reload a few times. `chrome://net-internals/#quic` shows active QUIC sessions.

How the browser upgrades:

```
1st request:   TCP 443 → HTTP/2 → response has Alt-Svc: h3=":443"
next requests: UDP 443 → HTTP/3 (QUIC)
```

