# =============================================================================
# 04 - Layer 4 (TCP) load balancer using the stream module
# -----------------------------------------------------------------------------
# File:     04-load-balancer-l4-stream/nginx.conf
# Install:  /etc/nginx/nginx.conf
#
# Balances raw TCP connections on :8080 across 1111/2222/3333.
# No URLs, headers or location blocks at this layer - balancing is per
# connection, so a browser keep-alive connection sticks to one backend.
#
# Requires: sudo apt install -y libnginx-mod-stream
# Test:     curl http://localhost:8080
# =============================================================================

include /etc/nginx/modules-enabled/*.conf;    # loads the stream module on Ubuntu

stream {
	upstream backends {
		server 127.0.0.1:1111;
		server 127.0.0.1:2222;
		server 127.0.0.1:3333;
	}

	server {
		listen 8080;
		proxy_pass backends;
	}
}

events {}
