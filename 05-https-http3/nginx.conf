# =============================================================================
# 05 - HTTPS + HTTP/2 + HTTP/3 (QUIC) load balancer
# -----------------------------------------------------------------------------
# File:     05-https-http3/nginx.conf
# Install:  /etc/nginx/nginx.conf
#
# Terminates TLS for nginx-badhon.webhop.me with a Let's Encrypt cert and
# load-balances to the three Docker containers.
#     443/tcp -> HTTP/1.1 + HTTP/2
#     443/udp -> HTTP/3 (QUIC), advertised to browsers via Alt-Svc
#
# Requires: certbot certificate (see README), nginx built with http_v3_module,
#           security group open on BOTH TCP 443 and UDP 443
# Test:     curl -sI https://nginx-badhon.webhop.me | grep -i alt-svc
# =============================================================================

http {
	upstream backends {
		server 127.0.0.1:1111;
		server 127.0.0.1:2222;
		server 127.0.0.1:3333;
	}

	server {
		listen 80;
		listen 8080;
		listen 443 ssl;                # HTTPS over TCP (HTTP/1.1 + HTTP/2)
		listen 443 quic reuseport;     # HTTP/3 over UDP
		http2 on;

		server_name nginx-badhon.webhop.me;

		ssl_certificate /etc/letsencrypt/live/nginx-badhon.webhop.me/fullchain.pem;
		ssl_certificate_key /etc/letsencrypt/live/nginx-badhon.webhop.me/privkey.pem;

		add_header Alt-Svc 'h3=":443"; ma=86400';   # tells browsers HTTP/3 exists

		location / {
			proxy_pass http://backends/;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}
	}
}

events {}
